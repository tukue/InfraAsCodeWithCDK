name: terraform-iac-ci

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-iac-ci.yml'

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            path: terraform
          - name: dev
            path: terraform/environments/dev
          - name: stage
            path: terraform/environments/stage
          - name: prod
            path: terraform/environments/prod
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.6.6

      - name: Terraform fmt
        working-directory: .
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

  security-scan:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkov Terraform scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,terraform-checkov.sarif
          quiet: true

      - name: Upload Checkov SARIF
        if: always() && hashFiles('terraform-checkov.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: terraform-checkov.sarif

      - name: Trivy Terraform scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: terraform
          hide-progress: true
          severity: CRITICAL,HIGH
          exit-code: '1'
